name: supabase-keepalive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지한다(2026-08-28 실제 발생,
# 사이트가 GAS 폴백으로 조용히 넘어가 두 달간 몰랐다). 매일 한 번 guardians 를 읽어 깨워 둔다.
# - 실패하면(=일시정지·장애) 런이 빨갛게 끝나고 GitHub 가 저장소 주인에게 메일을 보낸다.
# - 공개 저장소는 60일간 활동이 없으면 예약 워크플로가 꺼진다 → 매 실행마다 자기 자신을 enable 해 타이머를 초기화.
# - anon 키는 사이트 HTML 에 이미 공개된 값이라 challenge.html 에서 읽는다(키 교체 시 자동 반영).

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 읽기
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' challenge.html | head -1)
          KEY=$(grep -oE 'SUPABASE_KEY = "[^"]+"' challenge.html | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          test -n "$URL" && test -n "$KEY" || { echo "challenge.html 에서 Supabase URL/키를 못 찾음"; exit 1; }
          for i in 1 2 3; do
            CODE=$(curl -s -o body.json -w '%{http_code}' \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/guardians?select=id&limit=1")
            echo "시도 $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { cat body.json; echo; exit 0; }
            sleep 30
          done
          echo "::error::Supabase 응답 실패(HTTP $CODE) — 일시정지 여부를 대시보드에서 확인할 것"
          exit 1

      - name: 예약 워크플로 60일 비활성 타이머 초기화
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
