name: scheduled-deploy

# 2026-09-11 17:00 KST — 대시보드 달성율 변경을 main 으로 올려 Vercel Production 배포.
# PC 가 꺼져 있어도 돌도록 GitHub 에서 실행한다. 배포가 끝나면 이 파일은 지워도 된다.
# 배포할 내용 = 브랜치 scheduled/achievement-rate (main 보다 커밋 1개 앞, map-preview-svg.html 만 변경)

on:
  schedule:
    - cron: '10 7 11 9 *'   # 16:10 KST — 예약 트리거가 늦게 뜨는 걸 대비해 일찍 깨워 17:00 까지 기다린다
    - cron: '40 7 11 9 *'   # 16:40 KST — 첫 트리거가 누락될 때 대비 (이미 배포됐으면 할 일 없음)
  push:
    branches: [main]
    paths: ['.github/workflows/scheduled-deploy.yml']   # 이 파일을 올릴 때 드라이런으로 점검
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런 (푸시하지 않음)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: scheduled-deploy
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: scheduled/achievement-rate
  DEPLOY_FILE: map-preview-svg.html
  EXPECT_BLOB: d402913d193e38a124c85c332802295b3832dbe4   # 검수한 map-preview-svg.html 내용
  DEPLOY_DATE_KST: '2026-09-11'
  DEPLOY_AT_UTC: '2026-09-11T08:00:00Z'                  # = 17:00 KST
  LIVE_URL: https://www.guardian-bnikorea.com/dashboard
  LIVE_MARKER: 'id="rateNote"'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and fast-forward main
        id: ff
        env:
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(TZ=Asia/Seoul date +%F)" != "$DEPLOY_DATE_KST" ]; then
            echo "배포일이 아님 — 종료"; exit 0
          fi

          verify() {
            git fetch -q origin main "$DEPLOY_BRANCH"
            main=$(git rev-parse origin/main)
            target=$(git rev-parse "origin/$DEPLOY_BRANCH")
            echo "main=${main:0:7} target=${target:0:7} dry_run=$DRY_RUN"
            if [ "$main" = "$target" ]; then
              echo "이미 배포됨 — 푸시할 것 없음"; echo "pushed=already" >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(git rev-parse "$target:$DEPLOY_FILE")" = "$EXPECT_BLOB" ] || { echo "::error::배포 브랜치의 $DEPLOY_FILE 이 검수본과 다름"; exit 1; }
            [ "$(git rev-list --count "$main..$target")" = "1" ] || { echo "::error::배포 브랜치가 main 보다 정확히 1커밋 앞서 있지 않음"; exit 1; }
            [ "$(git diff --name-only "$main" "$target")" = "$DEPLOY_FILE" ] || { echo "::error::$DEPLOY_FILE 외 파일이 바뀜"; exit 1; }
          }

          verify
          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run origin "$target:refs/heads/main"
            echo "드라이런 통과 — 실제 푸시는 하지 않음"; exit 0
          fi

          wait=$(( $(date -u -d "$DEPLOY_AT_UTC" +%s) - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then echo "17:00 KST 까지 ${wait}초 대기"; sleep "$wait"; fi

          verify   # 기다리는 동안 다른 경로(PC 예약)가 먼저 배포했을 수 있다
          git push origin "$target:refs/heads/main"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          echo "main 푸시 완료: ${target:0:7}"

      - name: Verify live site
        if: steps.ff.outputs.pushed == 'yes' || steps.ff.outputs.pushed == 'already'
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$LIVE_URL?t=$(date +%s)" | grep -q "$LIVE_MARKER"; then
              echo "✅ 라이브 반영 확인 (${i}회차)"; exit 0
            fi
            sleep 20
          done
          echo "::error::10분 안에 라이브 반영을 확인하지 못함 — Vercel 확인 필요"; exit 1
